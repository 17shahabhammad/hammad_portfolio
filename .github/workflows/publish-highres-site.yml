name: Publish approved high-resolution drawing-quality update

on:
  push:
    branches:
      - main
    paths:
      - '.publish-highres-site'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out publication record
        uses: actions/checkout@v4

      - name: Read reviewed build run ID
        id: review
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(tr -d '[:space:]' < HIGHRES_REVIEW_RUN_ID.txt)"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid review build run ID" >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact reviewed website artifact
        uses: actions/download-artifact@v4
        with:
          name: HAD_Architect_Original_PDF_Review_Site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.review.outputs.run_id }}
          path: _site

      - name: Verify restored website package
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -d _site/assets
          test -d _site/pages
          page_count="$(find _site/pages -type f \( -name 'page-*.png' -o -name 'page-*.webp' \) | wc -l | tr -d ' ')"
          test "$page_count" = "538"
          test -f _site/assets/had-logo.jpg
          echo "Restored exact prior website package: 538 original-format drawing sheets and site assets present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish drawing-quality-only update
        id: deployment
        uses: actions/deploy-pages@v4
