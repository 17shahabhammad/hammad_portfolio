name: Build and publish HAD Architect portfolio

on:
  push:
    branches:
      - main
    paths:
      - '.build-site'
      - '.publish-site'
      - 'index.html'

permissions:
  contents: write

env:
  IMAGE_ASSETS_URL: 'https://www.dropbox.com/scl/fo/2rdu0h94xpwcb62lazkxd/AH2dTxjQp8UbeYQujEyMrmw?rlkey=15dummfaq9x5hnugp4qtgne79&dl=0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish-state.outputs.publish }}
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@v4

      - name: Record publication approval state
        id: publish-state
        shell: bash
        run: |
          if [[ -f .publish-site ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download image-only Dropbox folder
        shell: bash
        run: |
          set -euo pipefail
          download_url="${IMAGE_ASSETS_URL/dl=0/dl=1}"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$download_url" --output /tmp/had-image-packages.zip
          mkdir -p /tmp/had-packages _site
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          outer = Path("/tmp/had-image-packages.zip")
          dest = Path("/tmp/had-packages")
          with ZipFile(outer) as archive:
              bundles = [item for item in archive.infolist()
                         if not item.is_dir() and item.filename.lower().endswith(".zip")]
              for item in bundles:
                  name = item.filename.replace("\\", "/").rsplit("/", 1)[-1]
                  # Never recursively unpack the generated whole-site download that was
                  # placed beside the source image bundles for the user's convenience.
                  if name.lower() == "had-architect-complete-website.zip":
                      print(f"Skipping nested full-site archive: {name}")
                      continue
                  if name:
                      (dest / name).write_bytes(archive.read(item))
          print(f"Extracted {len(list(dest.glob('*.zip')))} inner ZIP bundles.")
          PY

      - name: Assemble static site from image packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find /tmp/had-packages -type f -name '*.zip' | sort)
          if [[ "${#packages[@]}" -ne 15 ]]; then
            echo "Expected 15 image-only ZIP packages (including clean-render overlay); found ${#packages[@]}." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            unzip -oq "$package" -d _site
          done
          # Overlay the specifically prepared clean render images last so they replace
          # the old title-sheet previews from the earlier asset bundle.
          clean_assets="/tmp/had-packages/site-assets-and-manifest-clean.zip"
          [[ -f "$clean_assets" ]] || { echo "Missing clean render asset bundle." >&2; exit 1; }
          unzip -oq "$clean_assets" -d _site
          cp index.html _site/index.html
          # Reconstruct the complete Park Land tower render from perspective sheet 01.
          # The PDF lays the tall render as two stacked image panels; cropping the render area
          # from the page image preserves the entire building, sky, and street without title blocks.
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("_site")
          source = root / "pages/05-park-land/page-002.png"
          if not source.is_file():
              raise SystemExit("Missing Park Land perspective sheet 01: pages/05-park-land/page-002.png")
          with Image.open(source) as im:
              im = im.convert("RGB")
              sx = im.width / 2384.0
              sy = im.height / 1684.0
              # Actual full-render rectangle on the original drawing sheet (PDF points).
              box = (round(505.6*sx), round(161.28*sy), round(1560.64*sx), round(1567.8*sy))
              render = im.crop(box)
              if render.width < 2500 or render.height < 3500:
                  raise SystemExit(f"Park Land full render crop unexpectedly small: {render.size}")
              destination = root / "assets/05-full-render.jpg"
              render.save(destination, "JPEG", quality=96, optimize=True, progressive=True)
              print(f"Park Land full render: {render.width} x {render.height} px")
          PY
          # Gate A has 25 pages in the supplied original PDF; remove stale over-counts from earlier render batches.
          rm -f _site/pages/01-sedra-gate/page-026.png _site/pages/01-sedra-gate/page-027.png _site/pages/01-sedra-gate/page-028.png
          # Repair four PNGs whose final IDAT checksum was truncated in the transferred bundle.
          # Load with Pillow's truncated-stream recovery, then save a fresh PNG at the same pixel dimensions.
          # This repairs container/checksum truncation only; no crop or resize is applied.
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path("_site/pages")
          targets = [
              root / "02-marriott/page-030.png",
              root / "07-dubai-south/page-009.png",
              root / "07-dubai-south/page-011.png",
              root / "08-valley-emaar/page-001.png",
          ]
          for path in targets:
              if not path.is_file():
                  raise SystemExit(f"Missing damaged drawing page to repair: {path}")
              with Image.open(path) as source:
                  size = source.size
                  recovered = source.convert("RGB")
              if recovered.size != size:
                  raise SystemExit(f"Repair changed sheet dimensions: {path} {size} -> {recovered.size}")
              tmp = path.with_suffix(".repaired.png")
              recovered.save(tmp, format="PNG", compress_level=3)
              with Image.open(tmp) as check:
                  check.verify()
              tmp.replace(path)
              print(f"Repaired PNG stream without crop/resize: {path} ({size[0]}x{size[1]})")
          PY

          # Persisted full-resolution overrides replace previously truncated source PNGs on every build.
          for rel in \
            pages/02-marriott/page-030.png \
            pages/07-dubai-south/page-009.png \
            pages/07-dubai-south/page-011.png \
            pages/08-valley-emaar/page-001.png; do
            if [[ -s "site-overrides/$rel" ]]; then
              cp "site-overrides/$rel" "_site/$rel"
              echo "Applied persistent full-resolution override: $rel"
            fi
          done

          # One-time source recovery: render the four known damaged sheets from the original PDFs.
          # The signed URLs are short-lived and removed from the branch after use; only the four corrected
          # page PNGs are kept as permanent overrides for future builds.
          if [[ -f .source-pdf-fix ]]; then
            if ! command -v pdftoppm >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y poppler-utils
            fi
            mkdir -p /tmp/had-source-fix
            while IFS='|' read -r folder page_csv url; do
              [[ -n "$folder" && -n "$page_csv" && -n "$url" ]] || continue
              source_pdf="/tmp/had-source-fix/${folder}.pdf"
              echo "Downloading original PDF for source regeneration: $folder"
              curl --fail --location --silent --show-error "$url" --output "$source_pdf"
              for page in ${page_csv//,/ }; do
                printf -v padded '%03d' "$page"
                tmp_prefix="/tmp/had-source-fix/${folder}-page-${padded}"
                pdftoppm -f "$page" -l "$page" -r 200 -png -singlefile "$source_pdf" "$tmp_prefix"
                rendered="${tmp_prefix}.png"
                destination="_site/pages/${folder}/page-${padded}.png"
                [[ -s "$rendered" ]] || { echo "Source render failed: $folder page $page" >&2; exit 1; }
                python3 - "$rendered" "$destination" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          source, destination = map(Path, sys.argv[1:3])
          with Image.open(source) as img:
              img.load()
              size = img.size
              if img.width < 6000 or img.height < 4200 or img.width / img.height < 1.3 or img.width / img.height > 1.5:
                  raise SystemExit(f"Regenerated sheet has unexpected dimensions: {source} {size}")
          with Image.open(source) as check:
              check.verify()
          destination.parent.mkdir(parents=True, exist_ok=True)
          source.replace(destination)
          with Image.open(destination) as check:
              check.verify()
              if check.size != size:
                  raise SystemExit(f"Dimensions changed after render: {destination}")
          print(f"Regenerated full-page sheet from source PDF: {destination} ({size[0]}x{size[1]})")
          PY
                mkdir -p "site-overrides/pages/${folder}"
                cp "$destination" "site-overrides/pages/${folder}/page-${padded}.png"
              done
            done < .source-pdf-fix
            rm -f .source-pdf-fix
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f -A -- site-overrides/pages/02-marriott/page-030.png site-overrides/pages/07-dubai-south/page-009.png site-overrides/pages/07-dubai-south/page-011.png site-overrides/pages/08-valley-emaar/page-001.png .source-pdf-fix
            if ! git diff --cached --quiet; then
              git commit -m "Persist full-resolution repairs for damaged drawing sheets"
              git push origin HEAD:main
            fi
          fi

          # Validate every full-page sheet, but avoid recompressing hundreds of large images.
          # All sheets retain their original pixel dimensions. Enhance only the two confirmed faint Expo Valley pages.
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageOps
          root = Path("_site/pages")
          files = sorted(root.rglob("page-*.png"))
          if len(files) != 538:
              raise SystemExit(f"Expected 538 drawing pages before image checks; found {len(files)}")
          extreme, corrupt, dimensions = [], [], {}
          for f in files:
              try:
                  with Image.open(f) as img:
                      width, height = img.size
                      img.verify()
                  dimensions[(width, height)] = dimensions.get((width, height), 0) + 1
                  ratio = width / height
                  if ratio < 0.45 or ratio > 2.4:
                      extreme.append(f"{f.as_posix()} ({width}x{height}, ratio={ratio:.3f})")
              except Exception as exc:
                  corrupt.append(f"{f.as_posix()}: {type(exc).__name__}: {exc}")
          if corrupt:
              print("CORRUPT OR TRUNCATED SHEET IMAGES:")
              for item in corrupt:
                  print("  " + item)
              raise SystemExit(f"{len(corrupt)} sheet images are corrupt/truncated and must be regenerated from source PDFs.")
          if extreme:
              print("ASPECT RATIO OUTLIERS (check for cropping):")
              for item in extreme:
                  print("  " + item)
              raise SystemExit(f"{len(extreme)} drawing sheet image(s) have extreme aspect ratios; refusing to package potentially cropped pages.")
          print(f"Validated all {len(files)} drawing images. Image dimensions unchanged.")
          print("Distinct sheet image dimensions:", sorted((w,h,n) for (w,h),n in dimensions.items()))

          # The exhaustive image decode, dimension and aspect-ratio checks above cover all 538 pages.
          # Repeat integrity checks on the four previously repaired pages; avoid a second full raster scan.
          repaired = (
              root / "02-marriott/page-030.png",
              root / "07-dubai-south/page-009.png",
              root / "07-dubai-south/page-011.png",
              root / "08-valley-emaar/page-001.png",
          )
          for path in repaired:
              if not path.is_file():
                  raise SystemExit(f"Missing full-resolution repaired sheet: {path}")
              with Image.open(path) as check:
                  check.verify()
              print(f"Verified repaired sheet: {path}")
          for name in ("page-007.png", "page-008.png"):
              path = root / "04-expo-valley" / name
              with Image.open(path) as src:
                  img = src.convert("RGB")
              img = ImageOps.autocontrast(img, cutoff=0.2)
              img = ImageEnhance.Contrast(img).enhance(1.22)
              img = ImageEnhance.Sharpness(img).enhance(1.40)
              img.save(path, format="PNG", compress_level=3)
              print(f"Enhanced faint Expo Valley page without crop or resize: {path} ({img.width}x{img.height})")
          PY
          # Improve pale linework on every sheet in luminance only, preserving original colors.
          # This is the tested contrast treatment from the Marriott/Expo comparison.
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter
          root = Path("_site/pages")
          files = sorted(root.rglob("page-*.png"))
          if len(files) != 538:
              raise SystemExit(f"Expected 538 sheets before enhancement; found {len(files)}")
          for index, path in enumerate(files, 1):
              with Image.open(path) as src:
                  src.load()
                  rgb = src.convert("RGB")
                  size = rgb.size
              y, cb, cr = rgb.convert("YCbCr").split()
              y = ImageEnhance.Contrast(y).enhance(1.65)
              y = y.filter(ImageFilter.UnsharpMask(radius=1.2, percent=115, threshold=2))
              enhanced = Image.merge("YCbCr", (y, cb, cr)).convert("RGB")
              if enhanced.size != size:
                  raise SystemExit(f"Enhancement changed sheet dimensions: {path}")
              temp = path.with_suffix(".enhanced.png")
              enhanced.save(temp, format="PNG", compress_level=1)
              with Image.open(temp) as check:
                  check.verify()
              temp.replace(path)
              if index % 50 == 0:
                  print(f"Enhanced {index}/{len(files)} sheets")
          print(f"Applied luminance-only contrast 1.65 and light sharpening to all {len(files)} pages; dimensions unchanged.")
          PY
          for cover in 01-cover.jpg 01-admin-render.jpg 01-guard-render.jpg 02-cover.jpg 02-cover-2.jpg 03-cover.jpg 03-cover-2.jpg 03-cover-3.jpg 04-cover.jpg 05-cover.jpg 05-cover-2.jpg 06-cover.jpg 06-cover-2.jpg 07-cover.jpg 07-cover-2.jpg 08-cover.jpg 08-cover-2.jpg 08-cover-3.jpg 09-cover.jpg 09-cover-2.jpg 09-cover-3.jpg; do
            if [[ ! -f "_site/assets/$cover" ]]; then echo "Missing clean architectural render: assets/$cover" >&2; exit 1; fi
          done
          [[ -f _site/assets/had-logo.jpg ]]
          [[ -f _site/assets/04-cover.jpg ]]
          [[ -f _site/assets/05-full-render.jpg ]]
          [[ -f _site/pages/01-sedra-gate/page-025.png ]]
          count="$(find _site/pages -type f -name 'page-*.png' | wc -l | tr -d ' ')"
          if [[ "$count" != "538" ]]; then
            echo "Expected 538 original drawing sheets; found $count." >&2
            exit 1
          fi
          if find _site -type f -iname '*.pdf' | grep -q .; then
            echo "Unexpected PDF found in public site package; refusing to publish original PDFs." >&2
            exit 1
          fi
          size_mb="$(du -sm _site | cut -f1)"
          echo "Validated $count drawing images; generated site size: ${size_mb} MB."
          if (( size_mb >= 1024 )); then
            echo "Site exceeds the 1 GB GitHub Pages limit." >&2
            exit 1
          fi

      - name: Create standalone cover-review HTML using actual cover assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _review
          python3 - <<'PY'
          from pathlib import Path
          import base64, mimetypes, re

          root = Path("_site")
          html = (root / "index.html").read_text(encoding="utf-8")

          # Inline actual project-cover images and the logo from the site asset package.
          refs = sorted(set(re.findall(r"assets/[A-Za-z0-9_.-]+\.(?:jpg|jpeg|png|svg)", html)), key=len, reverse=True)
          missing = []
          for ref in refs:
              file = root / ref
              if not file.is_file():
                  missing.append(ref)
                  continue
              mime = mimetypes.guess_type(file.name)[0] or "image/jpeg"
              data_uri = f"data:{mime};base64," + base64.b64encode(file.read_bytes()).decode("ascii")
              html = html.replace(ref, data_uri)
          if missing:
              raise SystemExit("Missing assets needed in preview: " + ", ".join(missing))

          # In the local review file each drawing set shows its first sheet only.
          # The full web build contains all 538 original sheets.
          def inline_page(folder):
              f = root / folder / "page-001.png"
              if not f.is_file():
                  raise SystemExit(f"Missing representative sheet image: {f}")
              return "data:image/png;base64," + base64.b64encode(f.read_bytes()).decode("ascii")

          marker = "const grid=document.getElementById('projectGrid')"
          if marker not in html:
              raise SystemExit("Could not locate projects array insertion point")
          # Inject per-project representative sheet images by using the source's existing project data.
          code = []
          code.append("projects.forEach(p=>{if(p.parts){p.parts.forEach(part=>{part.previewSrc=")
          code.append("'';part.pages=1;});}else{p.previewSrc='';p.pages=1;}});")
          code = "".join(code)
          # Build an object literal of inlined sheet samples keyed by the project's folder.
          # This keeps the preview file self-contained and never bundles the original PDFs.
          previews = {}
          for project_folder in [
              "pages/01-sedra-admin","pages/01-sedra-gate","pages/01-sedra-guard-house",
              "pages/02-marriott","pages/03-nad-al-hamar","pages/04-expo-valley",
              "pages/05-park-land","pages/06-emaar-villa","pages/07-dubai-south",
              "pages/08-valley-emaar","pages/09-residential-g4"
          ]:
              previews[project_folder] = inline_page(project_folder)

          # Extend sheet markup with a preview-only src and switch the page resolver to it.
          old_markup = 'data-folder="${part.folder}" data-pages="${part.pages}"'
          new_markup = 'data-folder="${part.folder}" data-preview-src="${part.previewSrc||\'\'}" data-pages="${part.pages}"'
          if old_markup not in html:
              raise SystemExit("Could not locate drawing viewer markup in source")
          html = html.replace(old_markup, new_markup)
          old_src = "function sheetSrc(v,n){return `${v.dataset.folder}/page-${String(n).padStart(3,'0')}.png`}"
          new_src = "function sheetSrc(v,n){return v.dataset.previewSrc || `${v.dataset.folder}/page-${String(n).padStart(3,'0')}.png`}"
          if old_src not in html:
              raise SystemExit("Could not locate drawing sheet URL resolver")
          html = html.replace(old_src, new_src)

          # The normal project-data objects are followed immediately by the grid constant.
          inject = []
          for folder, data_uri in previews.items():
              inject.append(f"window.HAD_PREVIEW_PAGES=window.HAD_PREVIEW_PAGES||{{}};window.HAD_PREVIEW_PAGES[{folder!r}]={data_uri!r};")
          inject.append("projects.forEach(p=>{if(p.parts){p.parts.forEach(part=>{part.previewSrc=window.HAD_PREVIEW_PAGES[part.folder];part.pages=1;});}else{p.previewSrc=window.HAD_PREVIEW_PAGES[p.folder];p.pages=1;}});")
          html = html.replace(marker, "".join(inject) + marker, 1)
          # Carry the preview sample into the fallback part used by projects with one drawing set.
          html = html.replace("folder:p.folder,pages:p.pages,desc:", "folder:p.folder,pages:p.pages,previewSrc:p.previewSrc,desc:")
          notice = '<div class="preview-notice">Cover review preview · actual project render covers · one representative drawing sheet per set · original PDFs are not included</div>'
          html = html.replace('<main class="home"', notice + '\n<main class="home"', 1)
          html = html.replace('</style>', '.preview-notice{padding:10px 20px;background:#302f2e;color:#fff;font:11px Arial,sans-serif;letter-spacing:.04em;text-align:center}\\n</style>', 1)
          Path("_review/HAD-Architect-Cover-Review.html").write_text(html, encoding="utf-8")
          print(f"Created review HTML: {Path('_review/HAD-Architect-Cover-Review.html').stat().st_size/1024/1024:.1f} MiB")
          print("Cover assets embedded:", len(refs))
          print("Representative sheet samples embedded:", len(previews))
          PY

      - name: Convert enhanced sheets to high-quality WebP and prepare complete preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          root = Path("_site")
          html_path = root / "index.html"
          html = html_path.read_text(encoding="utf-8")
          old_fn = "function sheetSrc(v,n){return `${v.dataset.folder}/page-${String(n).padStart(3,'0')}.png`}"
          new_fn = "function sheetSrc(v,n){return `${v.dataset.folder}/page-${String(n).padStart(3,'0')}.webp`}"
          if old_fn not in html:
              raise SystemExit("Could not find original drawing-sheet resolver in site HTML")
          html = html.replace(old_fn, new_fn, 1)
          old_markup = 'src="${part.folder}/page-001.png"'
          new_markup = 'src="${part.folder}/page-001.webp"'
          if old_markup not in html:
              raise SystemExit("Could not find initial sheet image path in site HTML")
          html = html.replace(old_markup, new_markup, 1)
          refs = set(re.findall(r"assets/[A-Za-z0-9_.-]+\.(?:jpg|jpeg|png|webp|svg)", html))
          missing = sorted(ref for ref in refs if not (root / ref).is_file())
          if missing:
              raise SystemExit("Missing referenced project/hero assets: " + ", ".join(missing))
          if len(re.findall(r"\"n\":\"", html)) != 9:
              raise SystemExit("Expected nine portfolio projects; refusing to package a different project list")
          if "Between Water & Light" in html or "House 3.0" in html:
              raise SystemExit("Competition project unexpectedly present in approved portfolio HTML")
          html_path.write_text(html, encoding="utf-8")
          files = sorted((root / "pages").rglob("page-*.png"))
          if len(files) != 538:
              raise SystemExit(f"Expected 538 enhanced sheet PNGs before conversion; found {len(files)}")
          for index, path in enumerate(files, 1):
              with Image.open(path) as src:
                  src.load()
                  image = src.convert("RGB")
                  dimensions = image.size
              destination = path.with_suffix(".webp")
              image.save(destination, format="WEBP", quality=98, method=6)
              with Image.open(destination) as check:
                  check.verify()
              with Image.open(destination) as check:
                  if check.size != dimensions:
                      raise SystemExit(f"WebP dimensions differ for {path}: {dimensions} -> {check.size}")
              path.unlink()
              if index % 50 == 0:
                  print(f"Converted {index}/{len(files)} sheets to quality-98 WebP")
          pages = sorted((root / "pages").rglob("page-*.webp"))
          if len(pages) != 538 or list((root / "pages").rglob("page-*.png")):
              raise SystemExit(f"Final sheet count/format mismatch: {len(pages)} WebP files")
          print(f"Verified all {len(pages)} WebP sheets; page dimensions preserved and all referenced hero assets exist ({len(refs)} asset references checked).")
          PY
          # Create a small starter archive folder and one sheet folder per portfolio project.
          mkdir -p _download_parts/starter/assets _download_parts/sedra/pages
          cp _site/index.html _download_parts/starter/index.html
          cp -a _site/assets/. _download_parts/starter/assets/
          cat > _download_parts/starter/README.txt <<'EOF'
          HAD Architect — High-Quality Drawing Preview
          
          1. Extract this starter package into an empty folder.
          2. Extract each of the nine drawing-project packages into that same folder.
          3. When asked to merge folders, keep the existing folders and allow the new pages files to be added.
          4. Open index.html in Edge or Chrome.
          5. Do not rename the assets or pages folders.
          
          The starter includes the complete website HTML and all project covers/hero renders. The project packages supply the 538 enhanced sheet images.
          EOF
          for folder in 01-sedra-admin 01-sedra-gate 01-sedra-guard-house; do cp -a "_site/pages/$folder" "_download_parts/sedra/pages/"; done
          for folder in 02-marriott 03-nad-al-hamar 04-expo-valley 05-park-land 06-emaar-villa 07-dubai-south 08-valley-emaar 09-residential-g4; do
            mkdir -p "_download_parts/$folder/pages"
            cp -a "_site/pages/$folder" "_download_parts/$folder/pages/"
          done
          du -sh _site _download_parts
          test "$(find _site/pages -type f -name 'page-*.webp' | wc -l | tr -d ' ')" = "538"

      - name: Upload clean-cover review file
        uses: actions/upload-artifact@v4
        with:
          name: had-architect-clean-covers-review
          path: _review/HAD-Architect-Cover-Review.html
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone review package
        uses: actions/upload-artifact@v4
        with:
          name: had-architect-preview
          path: _site/
          if-no-files-found: error
          retention-days: 7

      - name: Upload HAD_HiRes_Starter download pack
        uses: actions/upload-artifact@v4
        with:
          name: HAD_HiRes_Starter
          path: _download_parts/starter/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload HAD_HiRes_Sheets_SEDRA download pack
        uses: actions/upload-artifact@v4
        with:
          name: HAD_HiRes_Sheets_SEDRA
          path: _download_parts/sedra/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload HAD_HiRes_Sheets_Marriott download pack
        uses: actions/upload-artifact@v4
        with:
          name: HAD_HiRes_Sheets_Marriott
          path: _download_parts/02-marriott/**
