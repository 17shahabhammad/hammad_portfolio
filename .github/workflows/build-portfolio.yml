name: Build and publish HAD Architect portfolio

on:
  push:
    branches:
      - main
    paths:
      - '.build-site'
      - '.publish-site'
      - 'index.html'

permissions:
  contents: read

env:
  IMAGE_ASSETS_URL: 'https://www.dropbox.com/scl/fo/2rdu0h94xpwcb62lazkxd/AH2dTxjQp8UbeYQujEyMrmw?rlkey=15dummfaq9x5hnugp4qtgne79&dl=0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish-state.outputs.publish }}
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@v4

      - name: Record publication approval state
        id: publish-state
        shell: bash
        run: |
          if [[ -f .publish-site ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download image-only Dropbox folder
        shell: bash
        run: |
          set -euo pipefail
          download_url="${IMAGE_ASSETS_URL/dl=0/dl=1}"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$download_url" --output /tmp/had-image-packages.zip
          mkdir -p /tmp/had-packages _site
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          outer = Path("/tmp/had-image-packages.zip")
          dest = Path("/tmp/had-packages")
          with ZipFile(outer) as archive:
              bundles = [item for item in archive.infolist()
                         if not item.is_dir() and item.filename.lower().endswith(".zip")]
              for item in bundles:
                  name = item.filename.replace("\\", "/").rsplit("/", 1)[-1]
                  if name:
                      (dest / name).write_bytes(archive.read(item))
          print(f"Extracted {len(list(dest.glob('*.zip')))} inner ZIP bundles.")
          PY

      - name: Assemble static site from image packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find /tmp/had-packages -type f -name '*.zip' | sort)
          if [[ "${#packages[@]}" -ne 14 ]]; then
            echo "Expected 14 image-only ZIP packages; found ${#packages[@]}." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            unzip -oq "$package" -d _site
          done
          cp index.html _site/index.html
          # The Gate A PDF contains 25 pages; remove stale over-counted pages from the earlier render batch.
          rm -f _site/pages/01-sedra-gate/page-026.png _site/pages/01-sedra-gate/page-027.png _site/pages/01-sedra-gate/page-028.png
          # Crop image-only architectural renders from the first drawing sheet. These crops are used only as project covers;
          # the original high-resolution drawing sheets remain full-page and unchanged in the viewer.
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("_site")
          def crop_render(source, box, destination):
              src = root / source
              if not src.is_file():
                  raise SystemExit(f"Missing cover source sheet: {src}")
              with Image.open(src) as original:
                  im = original.convert("RGB")
                  sx, sy = im.width / 1500.0, im.height / 1060.0
                  x0, y0, x1, y1 = box
                  pix = (round(x0*sx), round(y0*sy), round(x1*sx), round(y1*sy))
                  if pix[0] < 0 or pix[1] < 0 or pix[2] > im.width or pix[3] > im.height:
                      raise SystemExit(f"Invalid crop {pix} for {src} ({im.width}x{im.height})")
                  out = im.crop(pix)
                  if out.width < 300 or out.height < 120:
                      raise SystemExit(f"Cover crop unexpectedly small: {destination} {out.size}")
                  target = root / "assets" / destination
                  target.parent.mkdir(parents=True, exist_ok=True)
                  out.save(target, "JPEG", quality=93, optimize=True, progressive=True)
                  print(f"Render cover {destination}: {out.width}x{out.height}")
          crop_render("pages/01-sedra-gate/page-001.png", (120, 90, 1400, 730), "01-cover.jpg")
          crop_render("pages/01-sedra-admin/page-001.png", (245, 105, 1280, 725), "01-admin-render.jpg")
          crop_render("pages/01-sedra-guard-house/page-001.png", (245, 105, 1280, 725), "01-guard-render.jpg")
          crop_render("pages/02-marriott/page-001.png", (30, 130, 590, 835), "02-cover.jpg")
          crop_render("pages/03-nad-al-hamar/page-001.png", (35, 15, 825, 1010), "03-cover.jpg")
          # Keep the separate, already-clean Expo Valley hero render from the supplied asset package.
          if not (root / "assets/04-cover.jpg").is_file():
              raise SystemExit("Missing standalone Expo Valley render asset.")
          crop_render("pages/05-park-land/page-001.png", (305, 95, 1030, 1000), "05-cover.jpg")
          crop_render("pages/06-emaar-villa/page-001.png", (340, 115, 1015, 475), "06-cover.jpg")
          crop_render("pages/06-emaar-villa/page-001.png", (340, 555, 1015, 955), "06-cover-2.jpg")
          crop_render("pages/07-dubai-south/page-001.png", (55, 75, 1015, 815), "07-cover.jpg")
          # Keep a copy of the original masterplan sheet so the second crop doesn't read the first cropped file.
          import shutil
          shutil.copyfile(root / "assets/08-cover.jpg", root / "assets/.08-cover-source.jpg")
          crop_render("assets/.08-cover-source.jpg", (115, 340, 520, 490), "08-cover.jpg")
          crop_render("assets/.08-cover-source.jpg", (560, 340, 1005, 490), "08-cover-2.jpg")
          (root / "assets/.08-cover-source.jpg").unlink(missing_ok=True)
          crop_render("pages/09-residential-g4/page-001.png", (45, 35, 1410, 620), "09-cover.jpg")
          PY
          for cover in 01-cover.jpg 02-cover.jpg 03-cover.jpg 04-cover.jpg 05-cover.jpg 06-cover.jpg 06-cover-2.jpg 07-cover.jpg 08-cover.jpg 08-cover-2.jpg 09-cover.jpg 01-admin-render.jpg 01-guard-render.jpg; do
            if [[ ! -f "_site/assets/$cover" ]]; then echo "Missing clean cover render: assets/$cover" >&2; exit 1; fi
          done
          [[ -f _site/assets/had-logo.jpg ]]
          [[ -f _site/assets/04-cover.jpg ]]
          [[ -f _site/pages/01-sedra-gate/page-025.png ]]
          count="$(find _site/pages -type f -name 'page-*.png' | wc -l | tr -d ' ')"
          if [[ "$count" != "538" ]]; then
            echo "Expected 538 original drawing sheets; found $count." >&2
            exit 1
          fi
          if find _site -type f -iname '*.pdf' | grep -q .; then
            echo "Unexpected PDF found in public site package; refusing to publish original PDFs." >&2
            exit 1
          fi
          size_mb="$(du -sm _site | cut -f1)"
          echo "Validated $count drawing images; generated site size: ${size_mb} MB."
          if (( size_mb >= 1024 )); then
            echo "Site exceeds the 1 GB GitHub Pages limit." >&2
            exit 1
          fi

      - name: Create standalone cover-review HTML using actual cover assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _review
          python3 - <<'PY'
          from pathlib import Path
          import base64, mimetypes, re

          root = Path("_site")
          html = (root / "index.html").read_text(encoding="utf-8")

          # Inline actual project-cover images and the logo from the site asset package.
          refs = sorted(set(re.findall(r"assets/[A-Za-z0-9_.-]+\.(?:jpg|jpeg|png|svg)", html)), key=len, reverse=True)
          missing = []
          for ref in refs:
              file = root / ref
              if not file.is_file():
                  missing.append(ref)
                  continue
              mime = mimetypes.guess_type(file.name)[0] or "image/jpeg"
              data_uri = f"data:{mime};base64," + base64.b64encode(file.read_bytes()).decode("ascii")
              html = html.replace(ref, data_uri)
          if missing:
              raise SystemExit("Missing assets needed in preview: " + ", ".join(missing))

          # In the local review file each drawing set shows its first sheet only.
          # The full web build contains all 538 original sheets.
          def inline_page(folder):
              f = root / folder / "page-001.png"
              if not f.is_file():
                  raise SystemExit(f"Missing representative sheet image: {f}")
              return "data:image/png;base64," + base64.b64encode(f.read_bytes()).decode("ascii")

          marker = "const grid=document.getElementById('projectGrid')"
          if marker not in html:
              raise SystemExit("Could not locate projects array insertion point")
          # Inject per-project representative sheet images by using the source's existing project data.
          code = []
          code.append("projects.forEach(p=>{if(p.parts){p.parts.forEach(part=>{part.previewSrc=")
          code.append("'';part.pages=1;});}else{p.previewSrc='';p.pages=1;}});")
          code = "".join(code)
          # Build an object literal of inlined sheet samples keyed by the project's folder.
          # This keeps the preview file self-contained and never bundles the original PDFs.
          previews = {}
          for project_folder in [
              "pages/01-sedra-admin","pages/01-sedra-gate","pages/01-sedra-guard-house",
              "pages/02-marriott","pages/03-nad-al-hamar","pages/04-expo-valley",
              "pages/05-park-land","pages/06-emaar-villa","pages/07-dubai-south",
              "pages/08-valley-emaar","pages/09-residential-g4"
          ]:
              previews[project_folder] = inline_page(project_folder)

          # Extend sheet markup with a preview-only src and switch the page resolver to it.
          old_markup = 'data-folder="${part.folder}" data-pages="${part.pages}"'
          new_markup = 'data-folder="${part.folder}" data-preview-src="${part.previewSrc||\'\'}" data-pages="${part.pages}"'
          if old_markup not in html:
              raise SystemExit("Could not locate drawing viewer markup in source")
          html = html.replace(old_markup, new_markup)
          old_src = "function sheetSrc(v,n){return `${v.dataset.folder}/page-${String(n).padStart(3,'0')}.png`}"
          new_src = "function sheetSrc(v,n){return v.dataset.previewSrc || `${v.dataset.folder}/page-${String(n).padStart(3,'0')}.png`}"
          if old_src not in html:
              raise SystemExit("Could not locate drawing sheet URL resolver")
          html = html.replace(old_src, new_src)

          # The normal project-data objects are followed immediately by the grid constant.
          inject = []
          for folder, data_uri in previews.items():
              inject.append(f"window.HAD_PREVIEW_PAGES=window.HAD_PREVIEW_PAGES||{{}};window.HAD_PREVIEW_PAGES[{folder!r}]={data_uri!r};")
          inject.append("projects.forEach(p=>{if(p.parts){p.parts.forEach(part=>{part.previewSrc=window.HAD_PREVIEW_PAGES[part.folder];part.pages=1;});}else{p.previewSrc=window.HAD_PREVIEW_PAGES[p.folder];p.pages=1;}});")
          html = html.replace(marker, "".join(inject) + marker, 1)
          # Carry the preview sample into the fallback part used by projects with one drawing set.
          html = html.replace("folder:p.folder,pages:p.pages,desc:", "folder:p.folder,pages:p.pages,previewSrc:p.previewSrc,desc:")
          notice = '<div class="preview-notice">Cover review preview · actual project render covers · one representative drawing sheet per set · original PDFs are not included</div>'
          html = html.replace('<main class="home"', notice + '\n<main class="home"', 1)
          html = html.replace('</style>', '.preview-notice{padding:10px 20px;background:#302f2e;color:#fff;font:11px Arial,sans-serif;letter-spacing:.04em;text-align:center}\\n</style>', 1)
          Path("_review/HAD-Architect-Cover-Review.html").write_text(html, encoding="utf-8")
          print(f"Created review HTML: {Path('_review/HAD-Architect-Cover-Review.html').stat().st_size/1024/1024:.1f} MiB")
          print("Cover assets embedded:", len(refs))
          print("Representative sheet samples embedded:", len(previews))
          PY

      - name: Upload clean-cover review file
        uses: actions/upload-artifact@v4
        with:
          name: had-architect-clean-covers-review
          path: _review/HAD-Architect-Cover-Review.html
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone review package
        uses: actions/upload-artifact@v4
        with:
          name: had-architect-preview
          path: _site/
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
