name: Build and deploy HAD Architect portfolio

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@v4

      - name: Download private-source-free image bundle asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/had-assets" dist
          gh release download portfolio-assets \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "HAD Architect Site Image Pages.zip" \
            --dir "$RUNNER_TEMP/had-assets"
          ARCHIVE="$RUNNER_TEMP/had-assets/HAD Architect Site Image Pages.zip"
          test -s "$ARCHIVE"
          cp index.html dist/index.html
          unzip -q "$ARCHIVE" -d dist
          test -f dist/index.html
          test -d dist/pages
          test -d dist/assets
          SHEET_COUNT=$(find dist/pages -type f -name 'page-*.png' | wc -l | tr -d ' ')
          echo "Rendered sheets found: $SHEET_COUNT"
          test "$SHEET_COUNT" = "541"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
